[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Startup script: waits for DB, runs migrations, then starts app
startCommand = "sh scripts/start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Health check verifica DB connection - dar tiempo suficiente para retry loop
healthcheckPath = "/api/health"
healthcheckTimeout = 180
