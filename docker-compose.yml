version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: inventario_peps_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventario_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      POSTGRES_DB: inventario_peps
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario_user -d inventario_peps"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario_peps_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inventario_user:${DB_PASSWORD:-changeme_in_production}@db:5432/inventario_peps?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_me_in_production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FISCALIZADOR_EMAIL: ${FISCALIZADOR_EMAIL:-fiscalizador@bodegaje.example.com}
      ENABLE_CRON_JOBS: ${ENABLE_CRON_JOBS:-true}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin (opcional, solo para desarrollo/staging)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inventario_peps_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bodegaje.example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: inventario_peps_network
